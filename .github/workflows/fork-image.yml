# Fork: publish ghcr.io/<owner>/tracearr-user-hide :latest and :supervised.
# Run by Fork sync after it merges a new upstream release, or by hand.
name: Fork image

on:
  workflow_dispatch:

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: ./docker/Dockerfile
            tag: latest
          - file: ./docker/Dockerfile.supervised
            tag: supervised
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve image name and version
        id: info
        run: |
          echo "image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          # Newest upstream release in this tree, so the update notice stays accurate
          git fetch --no-tags https://github.com/connorgallopo/Tracearr.git '+refs/tags/v*:refs/tags/v*'
          version=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/fetch-basemap

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.info.outputs.image }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          build-args: |
            APP_VERSION=${{ steps.info.outputs.version }}
            APP_TAG=${{ matrix.tag }}
            APP_COMMIT=${{ steps.info.outputs.short }}
            APP_BUILD_DATE=${{ steps.info.outputs.date }}
            CACHE_BUST=${{ steps.info.outputs.short }}

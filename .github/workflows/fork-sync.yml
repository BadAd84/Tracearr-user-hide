# Fork: merge each new upstream stable release; verify, push, then build images.
name: Fork sync

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Needs the workflow scope to push merges that touch upstream workflows
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Merge latest upstream release
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          upstream=https://github.com/connorgallopo/Tracearr.git
          tag=$(git ls-remote --tags --refs "$upstream" 'v*' | sed 's#.*refs/tags/##' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          # Separate ref: the fork publishes its own release tags with the same names
          git fetch --no-tags "$upstream" "+refs/tags/$tag:refs/upstream/$tag"
          if git merge-base --is-ancestor "refs/upstream/$tag" HEAD; then
            echo "Already on upstream $tag."
            exit 0
          fi
          git merge --no-edit -m "Merge upstream $tag" "refs/upstream/$tag"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.merge.outputs.merged == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.merge.outputs.merged == 'true'
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Verify and push
        if: steps.merge.outputs.merged == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm --filter @tracearr/server exec vitest run
          pnpm --filter @tracearr/web test
          git push origin HEAD:main

      - name: Build images
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run fork-image.yml

      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow list --all --json path,state \
            --jq '.[] | select(.state == "active") | select(.path | test("/fork-[^/]*$") | not) | .path' |
            while read -r path; do gh workflow disable "$(basename "$path")"; done
